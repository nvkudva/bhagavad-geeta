<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) return non-zero;
         without it the whole safe-area system is inert. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- One value, no prefers-color-scheme split: the app is dark by default whatever
         the OS says, so a light OS must not paint white chrome around a dark app.
         The pre-paint script below and SettingsProvider rewrite it on an explicit choice. -->
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Geeta" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Self-hosted. Only the Latin reading face is preloaded: the LCP element is the
         Latin h1 in the app bar, so Literata is on the LCP path and Noto Sans
         Devanagari is not. Preloading the 121 KB Devanagari face put 42% of the page
         weight ahead of the CSS and JS that the LCP text is actually waiting on.
         It still has font-display:swap and is still precached, so the first verse
         paints in the fallback face and swaps, instead of every screen waiting. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/literata-latin.woff2" crossorigin />
    <meta name="description" content="Geeta — the Bhagavad Gita in Sanskrit, Kannada and Telugu — a quiet, offline-capable reading app." />
    <title>Geeta</title>
    <script>
      // Resolve the theme before first paint: doing this in a useEffect guarantees a
      // theme flash on every cold start. The app is dark-first, so an unset preference
      // resolves to dark whatever the OS reports; only an explicit stored choice
      // selects light.
      (function () {
        try {
          var t = localStorage.getItem("gita-theme") === "light" ? "light" : "dark";
          document.documentElement.dataset.theme = t;
          if (t === "light") {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#FFFFFF");
          }
          // Same reason for the reading face: a swap after paint reflows every
          // verse. "literata" is the default and needs no attribute.
          var f = localStorage.getItem("gita-font");
          if (f && f !== "literata" && /^[a-z]+$/.test(f)) document.documentElement.dataset.font = f;
          // And the palette, which repaints the whole ground. "maroon" is the
          // default and needs no attribute.
          var p = localStorage.getItem("gita-palette");
          if (p && p !== "maroon" && /^[a-z]+$/.test(p)) document.documentElement.dataset.palette = p;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- The >=900px tiers. media= means a phone still fetches this, but at low
         priority and NOT render-blocking — it is ~40% of the stylesheet that a
         phone can never apply. It sits after the module script so Vite emits its
         <link> after the entry's own index.css link and the cascade order holds. -->
    <link rel="stylesheet" href="/src/desktop.css" media="(min-width: 900px)" />
  </body>
</html>
